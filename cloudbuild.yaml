# cloudbuild.yaml — Roamora CI/CD Pipeline
# Project: travel-planner-495705
# Triggers two builds (backend + frontend) in parallel, then deploys both to Cloud Run.
#
# HOW TO USE:
#   gcloud builds submit --config cloudbuild.yaml . --project=travel-planner-495705
#
# REQUIRED SECRET MANAGER SECRETS (create once):
#   gcloud secrets create GEMINI_API_KEY --data-file=- <<< "your-key"
#
# REQUIRED SUBSTITUTION VARIABLES (set in Cloud Build trigger or pass via --substitutions):
#   _REGION           : Cloud Run region (default: asia-south1)
#   _BACKEND_SERVICE  : Cloud Run backend service name
#   _FRONTEND_SERVICE : Cloud Run frontend service name

substitutions:
  _REGION: asia-south1
  _BACKEND_SERVICE: roamora-backend
  _FRONTEND_SERVICE: roamora-frontend
  _IMAGE_TAG: $COMMIT_SHA   # auto-set by Cloud Build; use "latest" for manual runs

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ─────────────────────────────────────────────
  # STEP 1 & 2: Build images in parallel
  # ─────────────────────────────────────────────

  # 1a. Build backend image
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-docker.pkg.dev/$PROJECT_ID/roamora/backend:$_IMAGE_TAG
      - -t
      - asia-docker.pkg.dev/$PROJECT_ID/roamora/backend:latest
      - ./backend
    waitFor: ["-"]   # start immediately (parallel)

  # 1b. Build frontend image
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_BACKEND_URL=https://$_BACKEND_SERVICE-url-placeholder
      - -t
      - asia-docker.pkg.dev/$PROJECT_ID/roamora/frontend:$_IMAGE_TAG
      - -t
      - asia-docker.pkg.dev/$PROJECT_ID/roamora/frontend:latest
      - ./frontend
    waitFor: ["-"]   # start immediately (parallel)

  # ─────────────────────────────────────────────
  # STEP 2: Push images to Artifact Registry
  # ─────────────────────────────────────────────

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - asia-docker.pkg.dev/$PROJECT_ID/roamora/backend
    waitFor: [build-backend]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - asia-docker.pkg.dev/$PROJECT_ID/roamora/frontend
    waitFor: [build-frontend]

  # ─────────────────────────────────────────────
  # STEP 3: Deploy to Cloud Run
  # ─────────────────────────────────────────────

  # 3a. Deploy backend
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_BACKEND_SERVICE
      - --image=asia-docker.pkg.dev/$PROJECT_ID/roamora/backend:$_IMAGE_TAG
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
    waitFor: [push-backend]

  # 3b. Deploy frontend (depends on backend URL being known)
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_FRONTEND_SERVICE
      - --image=asia-docker.pkg.dev/$PROJECT_ID/roamora/frontend:$_IMAGE_TAG
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
    waitFor: [push-frontend, deploy-backend]

images:
  - asia-docker.pkg.dev/$PROJECT_ID/roamora/backend:$_IMAGE_TAG
  - asia-docker.pkg.dev/$PROJECT_ID/roamora/frontend:$_IMAGE_TAG
